<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Solid background so the diagram reads in both GitHub light and dark mode -->
  <rect width="1060" height="650" fill="#ffffff"/>

  <text x="30" y="40" font-size="19" font-weight="700" fill="#232f3e">Code Review Board — AWS architecture</text>

  <!-- ===================== Left: developer, GitHub, client ===================== -->
  <rect x="30" y="70" width="190" height="46" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="125" y="98" font-size="13" text-anchor="middle" fill="#24292f">Developer · git push</text>

  <line x1="125" y1="116" x2="125" y2="133" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="135" width="200" height="155" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <rect x="30" y="135" width="200" height="28" rx="8" fill="#24292f"/>
  <rect x="30" y="152" width="200" height="11" fill="#24292f"/>
  <text x="130" y="154" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">GitHub Actions</text>
  <rect x="46" y="175" width="168" height="40" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="130" y="192" font-size="12" font-weight="600" text-anchor="middle" fill="#24292f">agent.yml</text>
  <text x="130" y="207" font-size="10.5" text-anchor="middle" fill="#57606a">lint · ARM64 build · push</text>
  <rect x="46" y="223" width="168" height="40" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="130" y="240" font-size="12" font-weight="600" text-anchor="middle" fill="#24292f">terraform.yml</text>
  <text x="130" y="255" font-size="10.5" text-anchor="middle" fill="#57606a">plan · gated apply/destroy</text>
  <text x="130" y="281" font-size="10.5" font-style="italic" text-anchor="middle" fill="#57606a">keyless OIDC · scoped roles</text>

  <rect x="30" y="360" width="190" height="48" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="125" y="381" font-size="13" font-weight="600" text-anchor="middle" fill="#24292f">Client / CLI</text>
  <text x="125" y="398" font-size="10.5" text-anchor="middle" fill="#57606a">{"diff": "..."}</text>

  <!-- ===================== AWS boundary ===================== -->
  <rect x="280" y="70" width="760" height="560" rx="10" fill="#f7f8fa" stroke="#879196" stroke-width="1.5"/>
  <rect x="280" y="70" width="760" height="30" rx="10" fill="#232f3e"/>
  <rect x="280" y="88" width="760" height="12" fill="#232f3e"/>
  <text x="298" y="90" font-size="13" font-weight="700" fill="#ffffff">AWS  ·  eu-west-1</text>

  <!-- ECR -->
  <rect x="330" y="118" width="170" height="54" rx="8" fill="#ffffff" stroke="#ec7211" stroke-width="1.5"/>
  <text x="415" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#232f3e">Amazon ECR</text>
  <text x="415" y="158" font-size="11" text-anchor="middle" fill="#57606a">ARM64 agent image</text>

  <!-- AgentCore Runtime -->
  <rect x="330" y="200" width="430" height="400" rx="10" fill="#ffffff" stroke="#ec7211" stroke-width="2"/>
  <rect x="330" y="200" width="430" height="30" rx="10" fill="#ec7211"/>
  <rect x="330" y="218" width="430" height="12" fill="#ec7211"/>
  <text x="545" y="220" font-size="13.5" font-weight="700" text-anchor="middle" fill="#ffffff">Amazon Bedrock AgentCore Runtime</text>
  <text x="545" y="250" font-size="11" font-style="italic" text-anchor="middle" fill="#57606a">serverless · session-isolated microVM · GET /ping + POST /invocations</text>

  <!-- Supervisor -->
  <rect x="355" y="266" width="380" height="44" rx="7" fill="#eef1fb" stroke="#5b6ad0" stroke-width="1.5"/>
  <text x="545" y="286" font-size="13" font-weight="700" text-anchor="middle" fill="#232f3e">Supervisor agent</text>
  <text x="545" y="302" font-size="10.5" text-anchor="middle" fill="#57606a">decides to call each critic as a tool</text>

  <!-- Fan-out supervisor -> critics -->
  <line x1="545" y1="310" x2="399" y2="338" stroke="#5b6ad0" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="545" y1="310" x2="497" y2="338" stroke="#5b6ad0" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="545" y1="310" x2="593" y2="338" stroke="#5b6ad0" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="545" y1="310" x2="691" y2="338" stroke="#5b6ad0" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Critics -->
  <rect x="355" y="340" width="88" height="54" rx="6" fill="#eef1fb" stroke="#5b6ad0"/>
  <text x="399" y="363" font-size="11.5" font-weight="600" text-anchor="middle" fill="#232f3e">Security</text>
  <text x="399" y="380" font-size="10" text-anchor="middle" fill="#57606a">critic</text>
  <rect x="453" y="340" width="88" height="54" rx="6" fill="#eef1fb" stroke="#5b6ad0"/>
  <text x="497" y="363" font-size="11.5" font-weight="600" text-anchor="middle" fill="#232f3e">Performance</text>
  <text x="497" y="380" font-size="10" text-anchor="middle" fill="#57606a">critic</text>
  <rect x="551" y="340" width="88" height="54" rx="6" fill="#eef1fb" stroke="#5b6ad0"/>
  <text x="595" y="363" font-size="11.5" font-weight="600" text-anchor="middle" fill="#232f3e">Style</text>
  <text x="595" y="380" font-size="10" text-anchor="middle" fill="#57606a">critic</text>
  <rect x="649" y="340" width="88" height="54" rx="6" fill="#eef1fb" stroke="#5b6ad0"/>
  <text x="693" y="363" font-size="11.5" font-weight="600" text-anchor="middle" fill="#232f3e">Tests</text>
  <text x="693" y="380" font-size="10" text-anchor="middle" fill="#57606a">critic</text>

  <!-- Critics -> formatter -->
  <line x1="545" y1="394" x2="545" y2="418" stroke="#5b6ad0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="553" y="410" font-size="10" fill="#57606a">consolidated review</text>

  <!-- Formatter -->
  <rect x="355" y="420" width="380" height="44" rx="7" fill="#eef1fb" stroke="#5b6ad0" stroke-width="1.5"/>
  <text x="545" y="440" font-size="13" font-weight="700" text-anchor="middle" fill="#232f3e">Formatter agent</text>
  <text x="545" y="456" font-size="10.5" text-anchor="middle" fill="#57606a">structured output → Review JSON (Pydantic)</text>

  <text x="545" y="490" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5b6ad0">Strands Agents · agents-as-tools pattern</text>

  <!-- IAM execution role -->
  <rect x="355" y="506" width="380" height="70" rx="7" fill="#ffffff" stroke="#879196" stroke-dasharray="5 4"/>
  <text x="545" y="527" font-size="12" font-weight="700" text-anchor="middle" fill="#232f3e">IAM execution role</text>
  <text x="545" y="545" font-size="10.5" text-anchor="middle" fill="#57606a">trusts bedrock-agentcore (SourceAccount + SourceArn)</text>
  <text x="545" y="561" font-size="10.5" text-anchor="middle" fill="#57606a">invoke Nova Lite only · ECR pull · logs · X-Ray</text>

  <!-- Bedrock -->
  <rect x="800" y="300" width="215" height="64" rx="8" fill="#ffffff" stroke="#ec7211" stroke-width="1.5"/>
  <text x="907" y="324" font-size="13" font-weight="700" text-anchor="middle" fill="#232f3e">Amazon Bedrock</text>
  <text x="907" y="342" font-size="11" text-anchor="middle" fill="#57606a">Nova Lite</text>
  <text x="907" y="356" font-size="9.5" text-anchor="middle" fill="#57606a">eu.amazon.nova-lite-v1:0</text>

  <!-- CloudWatch -->
  <rect x="800" y="430" width="215" height="74" rx="8" fill="#ffffff" stroke="#ec7211" stroke-width="1.5"/>
  <text x="907" y="453" font-size="13" font-weight="700" text-anchor="middle" fill="#232f3e">Amazon CloudWatch</text>
  <text x="907" y="471" font-size="11" text-anchor="middle" fill="#57606a">GenAI Observability</text>
  <text x="907" y="487" font-size="10" text-anchor="middle" fill="#57606a">OTEL traces · logs · metrics</text>

  <!-- Budget -->
  <rect x="800" y="540" width="215" height="44" rx="8" fill="#ffffff" stroke="#879196"/>
  <text x="907" y="560" font-size="12" font-weight="700" text-anchor="middle" fill="#232f3e">AWS Budgets</text>
  <text x="907" y="575" font-size="10" text-anchor="middle" fill="#57606a">$5 alert · ~$0 at rest</text>

  <!-- ===================== Arrows ===================== -->
  <!-- agent.yml -> ECR -->
  <path d="M214,195 C270,195 280,145 328,145" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="236" y="214" font-size="10" fill="#57606a">OIDC · push</text>

  <!-- terraform.yml -> Runtime -->
  <path d="M214,243 C275,243 290,215 328,215" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="236" y="262" font-size="10" fill="#57606a">OIDC · provision</text>

  <!-- ECR -> Runtime (image pull) -->
  <line x1="415" y1="172" x2="415" y2="198" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="423" y="190" font-size="10" fill="#57606a">pull :latest</text>

  <!-- Client -> Runtime -->
  <line x1="220" y1="384" x2="328" y2="384" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="226" y="376" font-size="10" fill="#57606a">InvokeAgentRuntime</text>

  <!-- Runtime -> Bedrock -->
  <line x1="760" y1="332" x2="798" y2="332" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="763" y="324" font-size="9.5" fill="#57606a">~5 calls</text>

  <!-- Runtime -> CloudWatch -->
  <line x1="760" y1="467" x2="798" y2="467" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="764" y="459" font-size="9.5" fill="#57606a">spans</text>
</svg>
